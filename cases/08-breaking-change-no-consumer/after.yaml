openapi: 3.0.3
info:
  title: Orders API
  version: 1.0.0
paths:
  /orders:
    get:
      operationId: listOrders
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrder'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /orders/{id}:
    get:
      operationId: getOrder
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
    delete:
      operationId: cancelOrder
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: cancelled
components:
  schemas:
    Order:
      type: object
      required:
      - id
      - status
      - total
      properties:
        id:
          type: integer
        status:
          type: string
          enum:
          - pending
          - paid
          - shipped
        total:
          type: number
        customer_id:
          type: string
    NewOrder:
      type: object
      required:
      - customer_id
      - items
      properties:
        customer_id:
          type: string
        currency:
          type: string
          enum:
          - USD
          - EUR
          - INR
        items:
          type: array
          items:
            type: string
        note:
          type: string
          maxLength: 200
    Customer:
      type: object
      required:
      - id
      - email
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
